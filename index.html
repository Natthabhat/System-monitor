<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Monitor</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel-2: #1c232d; --border: #2a323d;
  --text: #e6edf3; --muted: #8b98a8; --grid: #232b36;
  --c1: #4c9aff; --c2: #3ecf8e; --c3: #f5a524; --c4: #c084fc;
  --ok: #3ecf8e; --warn: #f5a524; --bad: #ef4444; --grip: #6ee7b7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f0f3f7; --border: #dde3ea;
          --text: #18202a; --muted: #5d6b7c; --grid: #e7ecf1;
          --c1: #2563eb; --c2: #059669; --c3: #d97706; --c4: #9333ea; --grip: #059669; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
         padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; }
.reset { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); background: transparent;
         border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset:hover { color: var(--text); border-color: var(--muted); }
header .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
/* flex-wrap so each row stretches to fill: no holes whatever order the user picks */
main { padding: 16px 20px 32px; max-width: 1500px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
.block { flex: 1 1 100%; min-width: 0; }
.block.w3 { flex-basis: calc(50% - 14px); }
.block.w2 { flex-basis: calc(33.333% - 14px); }
@media (max-width: 1250px) { .block.w2 { flex-basis: calc(50% - 14px); } }
@media (max-width: 800px) { .block.w2, .block.w3 { flex-basis: 100%; } }
.ttl { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.grip { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 0; padding: 0; cursor: grab;
        background: var(--panel-2); touch-action: none; display: inline-grid; place-items: center; }
.grip::before { content: ""; width: 8px; height: 12px;
  background: radial-gradient(circle, var(--grip) 1.6px, transparent 1.9px) 0 0 / 4px 4px;
  /* 2 x 3 dots */ }
/* grip appears only while hovering its section (always shown on touch screens, keyboard focus and while dragging) */
@media (hover: hover) {
  /* hidden grip takes no space (negative margin cancels the 10px title gap), so titles sit flush left;
     on hover it grows in and nudges the title right */
  .grip { width: 0; margin-right: -10px; opacity: 0; overflow: hidden;
          transition: width .16s ease, margin-right .16s ease, opacity .16s ease; }
  .block:hover .grip, .grip:focus-visible, .block.dragging .grip { width: 28px; margin-right: 0; opacity: 1; }
}
.grip:hover, .grip:focus-visible { background: color-mix(in srgb, var(--grip) 16%, var(--panel-2)); outline: none; }
.grip:focus-visible { box-shadow: 0 0 0 2px var(--grip); }
.block.dragging { opacity: .55; outline: 2px dashed var(--grip); outline-offset: 3px; z-index: 2; }
.block.dragging .grip { cursor: grabbing; }
body.is-dragging { cursor: grabbing; user-select: none; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .val { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { min-height: 28px; font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
canvas { width: 100%; height: 140px; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 12px; }
.core { background: var(--panel-2); border-radius: 6px; padding: 4px 6px; font-size: 11px; color: var(--muted); position: relative; overflow: hidden; }
.core .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c1); transition: width .4s; }
.core b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 500; float: right; }
.bar-row { margin: 10px 0; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 13px; gap: 10px; }
.bar-row .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--panel-2); margin-top: 5px; overflow: hidden; }
.bar > div { width: 0; height: 100%; border-radius: 4px; background: var(--c1); transition: width .4s; }
.bar.stack { display: flex; }
.bar.stack > div { border-radius: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.temps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.temp { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.temp .t { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.temp .l { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gpu + .gpu { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
.gpu .stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.gpu .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.note { margin-top: 8px; font-size: 11px; color: var(--muted); }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
/* ---- gauges ---- */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px 14px; min-width: 0; }
.panel h3 { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 28px; margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.panel h3 span { text-transform: none; font-weight: 400; color: var(--muted); margin-left: -4px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.gauge { position: relative; aspect-ratio: 1; max-width: 170px; width: 100%; margin: 0 auto; }
.gauge svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gauge .track { fill: none; stroke: var(--panel-2); stroke-width: 9; }
.gauge .val { fill: none; stroke: var(--c1); stroke-width: 9; stroke-linecap: butt;
              transition: stroke-dasharray .6s ease, stroke .3s; }
.gauge.ring svg { transform: rotate(-90deg); }
.gauge.dial .track, .gauge.dial .val { transform: rotate(135deg); transform-origin: 60px 60px; }
.gauge .needle { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round;
                 transform-origin: 60px 60px; transition: transform .6s ease; }
.gauge .hub { fill: var(--panel); stroke: var(--text); stroke-width: 2.5; }
.gauge .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.gauge.dial .center { justify-content: flex-end; padding-bottom: 4%; }
.gauge .g-label { font-size: clamp(10px, 1.1vw, 13px); font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.gauge.dial .g-label { font-size: clamp(9px, .9vw, 11px); }
.gauge .g-num { font-size: clamp(24px, 3vw, 38px); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.gauge.dial .g-num { font-size: clamp(20px, 2.4vw, 30px); }
.gauge .g-num small { font-size: .38em; font-weight: 500; margin-left: 2px; color: var(--muted); }
.gauge .g-sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge.na { opacity: .45; }
.stor-head { display: flex; justify-content: space-between; align-items: center; }
.stor-legend { font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
.stor-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.stor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.drive .dname { background: var(--panel-2); border-radius: 6px 6px 0 0; padding: 6px 10px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.drive .dname span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drive .dname span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.blk { position: relative; height: 44px; margin-top: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.blk .bf { position: absolute; inset: 0 auto 0 0; background: var(--c1); transition: width .6s ease; }
.blk.free .bf { background: color-mix(in srgb, var(--muted) 30%, transparent); }
.blk .bt { position: relative; display: flex; justify-content: space-between; align-items: flex-end; height: 100%; padding: 0 10px 6px; }
.blk .bt b { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.blk .bt b small { font-size: 12px; font-weight: 500; margin-left: 2px; }
.blk .bt span { font-size: 12px; }
.blk.used .bf { background: color-mix(in srgb, var(--fc, var(--c1)) 60%, transparent); }
.blk.free .bt { color: var(--muted); }

@media (max-width: 520px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .status { margin-left: 0; }
  .table-wrap { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <h1 id="host">Server</h1>
  <div class="meta"><span id="os"></span><span id="cpumodel"></span><span id="uptime"></span></div>
  <button class="reset" id="reset-layout" type="button" title="Put every section back in its original place">Reset layout</button>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></div>
</header>
<main id="board">
  <section class="block card" data-id="overview">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Overview</span></h2>
    <div class="kpis">
    <div class="kpi"><div class="label">CPU</div><div class="val" id="k-cpu">–</div><div class="sub" id="k-cpu-sub"></div></div>
    <div class="kpi"><div class="label">Memory</div><div class="val" id="k-mem">–</div><div class="sub" id="k-mem-sub"></div></div>
    <div class="kpi"><div class="label">GPU</div><div class="val" id="k-gpu">–</div><div class="sub" id="k-gpu-sub"></div></div>
    <div class="kpi"><div class="label">Network ↓ / ↑</div><div class="val" id="k-net">–</div><div class="sub" id="k-net-sub"></div></div>
    <div class="kpi"><div class="label">Disk I/O R / W</div><div class="val" id="k-disk">–</div><div class="sub" id="k-disk-sub"></div></div>
    <div class="kpi"><div class="label">Power</div><div class="val" id="k-pw">–</div><div class="sub" id="k-pw-sub"></div></div>
    <div class="kpi"><div class="label">Hottest sensor</div><div class="val" id="k-temp">–</div><div class="sub" id="k-temp-sub"></div></div>
    </div>
  </section>

  <div id="meters-anchor" hidden></div>

  <section class="block panel" data-id="storage">
    <div class="stor-head"><h3><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Storage</h3>
      <div class="stor-legend"><span><i style="background:var(--c1)"></i>Used</span><span><i style="background:color-mix(in srgb,var(--muted) 45%,transparent)"></i>Free</span></div></div>
    <div class="stor-grid" id="storage"></div>
  </section>

  <section class="block w2 card" data-id="c-cpu">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>CPU</span> <small id="cpu-meta"></small></h2>
    <canvas id="ch-cpu"></canvas>
    <div class="cores" id="cores"></div>
  </section>
  <section class="block w2 card" data-id="c-mem">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Memory</span> <small id="mem-meta"></small></h2>
    <canvas id="ch-mem"></canvas>
    <div class="legend"><span><i style="background:var(--c2)"></i>RAM used</span><span><i style="background:var(--c3)"></i>Swap used</span></div>
    <div class="bar-row"><div class="top"><span>RAM (used · cache)</span><span id="mem-txt"></span></div>
      <div class="bar stack"><div id="mem-used" style="background:var(--c2)"></div><div id="mem-cache" style="background:color-mix(in srgb,var(--c2) 35%,transparent)"></div></div></div>
    <div class="bar-row"><div class="top"><span>Swap</span><span id="swap-txt"></span></div>
      <div class="bar"><div id="swap-bar" style="background:var(--c3)"></div></div></div>
  </section>
  <section class="block w2 card" data-id="c-net">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Network</span> <small id="net-meta"></small></h2>
    <canvas id="ch-net"></canvas>
    <div class="legend"><span><i style="background:var(--c1)"></i>Download</span><span><i style="background:var(--c4)"></i>Upload</span></div>
    <div class="table-wrap"><table id="nics"></table></div>
  </section>
  <section class="block w2 card" data-id="c-disk">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Disk I/O</span> <small id="disk-meta"></small></h2>
    <canvas id="ch-disk"></canvas>
    <div class="legend"><span><i style="background:var(--c2)"></i>Read</span><span><i style="background:var(--c3)"></i>Write</span></div>
    <div id="disks"></div>
  </section>
  <section class="block w2 card" data-id="c-gpu">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>GPU</span> <small id="gpu-meta"></small></h2>
    <canvas id="ch-gpu"></canvas>
    <div class="legend" id="gpu-legend"></div>
    <div id="gpus" style="margin-top:10px"></div>
  </section>
  <section class="block w2 card" data-id="c-power">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Power</span> <small id="pw-meta"></small></h2>
    <canvas id="ch-power"></canvas>
    <div class="legend"><span><i style="background:var(--c3)"></i>Total</span><span><i style="background:var(--c1)"></i>CPU</span><span><i style="background:var(--c4)"></i>GPU</span></div>
    <div class="table-wrap"><table id="pw-table"></table></div>
    <div class="note" id="pw-note"></div>
  </section>
  <section class="block w2 card" data-id="c-temps">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Temperatures</span></h2>
    <div class="temps" id="temps"></div>
  </section>

  <section class="block card" data-id="procs">
    <h2><span class="ttl"><button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>Top processes</span> <small>by CPU</small></h2>
    <div class="table-wrap"><table id="procs"></table></div>
  </section>
</main>

<script>
const HISTORY = 120;
const hist = { cpu: [], mem: [], swap: [], rx: [], tx: [], rd: [], wr: [], gpu: [], pwT: [], pwC: [], pwG: [] };
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function bytes(n, d = 1) {
  if (n == null) return '–';
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0;
  while (Math.abs(n) >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i === 0 ? 0 : d) + ' ' + u[i];
}
const rate = n => bytes(n) + '/s';
const pct = n => (n == null ? '–' : n.toFixed(1) + '%');
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
}
const level = (v, w, b) => v >= b ? 'bad' : v >= w ? 'warn' : 'ok';
const push = (arr, v) => { arr.push(v); if (arr.length > HISTORY) arr.shift(); };

function drawChart(canvas, series, opts = {}) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  let max = opts.max;
  if (max == null) {
    // 4 gridlines on round steps (1, 1.5, 2, 2.5, 3, 4, 5, 7.5 × 10^n) so labels read 0/10/20/30/40, not 13/25/38
    const raw = Math.max(1, ...series.flatMap(s => s.data)) / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10].map(m => m * mag).find(v => v >= raw);
    max = step * 4;
  }
  const padL = 58, padR = 6, padT = 6, padB = 4;
  const cw = w - padL - padR, chh = h - padT - padB;
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const y = padT + chh * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, Math.round(y) + .5); ctx.lineTo(w - padR, Math.round(y) + .5); ctx.stroke();
    ctx.fillText(opts.fmt ? opts.fmt(max * (1 - i / 4)) : Math.round(max * (1 - i / 4)), padL - 8, y);
  }
  const step = cw / (HISTORY - 1);
  for (const s of series) {
    const d = s.data; if (!d.length) continue;
    const x0 = padL + (HISTORY - d.length) * step;
    const pts = d.map((v, i) => [x0 + i * step, padT + chh * (1 - Math.min(v, max) / max)]);
    const col = css(s.color);
    if (s.fill) {
      const g = ctx.createLinearGradient(0, padT, 0, padT + chh);
      g.addColorStop(0, col + '55'); g.addColorStop(1, col + '05');
      ctx.beginPath(); ctx.moveTo(pts[0][0], padT + chh);
      pts.forEach(p => ctx.lineTo(p[0], p[1]));
      ctx.lineTo(pts[pts.length - 1][0], padT + chh); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  }
}

const GRIP = '<button class="grip" type="button" aria-label="Drag to move this section" title="Drag to move"></button>';

// ---------- movable sections ----------
const Layout = (() => {
  const KEY = 'server-monitor.layout.v1';
  const board = () => $('board');
  const blocks = () => [...board().querySelectorAll(':scope > .block')];
  let defaultOrder = null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(blocks().map(b => b.dataset.id))); } catch {} };

  function apply() {
    const cur = blocks();
    if (!defaultOrder) defaultOrder = cur.map(b => b.dataset.id);   // first build = factory order
    cur.forEach((b, i) => { if (!defaultOrder.includes(b.dataset.id)) defaultOrder.splice(i, 0, b.dataset.id); });
    const saved = load(); if (!saved) return;
    const byId = Object.fromEntries(cur.map(b => [b.dataset.id, b]));
    const order = saved.filter(id => byId[id]);
    // sections not in the saved layout (e.g. a new GPU) slot in after their default neighbour
    defaultOrder.forEach((id, i) => {
      if (!byId[id] || order.includes(id)) return;
      const prev = defaultOrder.slice(0, i).reverse().find(p => order.includes(p));
      order.splice(prev ? order.indexOf(prev) + 1 : 0, 0, id);
    });
    order.forEach(id => board().appendChild(byId[id]));
    redraw();
  }

  // FLIP animation so other sections glide into place
  function move(fn) {
    const before = new Map(blocks().map(b => [b, b.getBoundingClientRect()]));
    fn();
    blocks().forEach(b => {
      const a = before.get(b), n = b.getBoundingClientRect();
      if (!a || b.classList.contains('dragging')) return;
      const dx = a.left - n.left, dy = a.top - n.top;
      if (!dx && !dy) return;
      b.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
                { duration: 180, easing: 'ease-out' });
    });
  }
  function redraw() { requestAnimationFrame(() => typeof drawAll === 'function' && drawAll()); }

  let drag = null;
  function onDown(e) {
    const grip = e.target.closest('.grip'); if (!grip || e.button > 0) return;
    e.preventDefault();
    const block = grip.closest('.block');
    drag = { block, grip, x: e.clientX, y: e.clientY, id: e.pointerId };
    grip.setPointerCapture(e.pointerId);
    block.classList.add('dragging'); document.body.classList.add('is-dragging');
    drag.timer = setInterval(autoScroll, 16);
  }
  function autoScroll() {
    if (!drag) return;
    const edge = 70, y = drag.y;
    if (y < edge) window.scrollBy(0, -Math.ceil((edge - y) / 4));
    else if (y > innerHeight - edge) window.scrollBy(0, Math.ceil((y - innerHeight + edge) / 4));
    hover();
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY; hover();
  }
  function hover() {
    const el = document.elementFromPoint(drag.x, drag.y);
    const target = el && el.closest('#board > .block');
    if (!target || target === drag.block) { drag.last = null; return; }
    // only react once per entered section, otherwise the shifted layout flip-flops it back
    if (target === drag.last) return;
    const r = target.getBoundingClientRect();
    const fullRow = r.width > board().clientWidth * 0.8;
    const after = fullRow ? drag.y > r.top + r.height / 2 : drag.x > r.left + r.width / 2;
    const ref = after ? target.nextSibling : target;
    if (ref === drag.block || drag.block.nextSibling === ref) return;
    drag.last = target;
    move(() => board().insertBefore(drag.block, ref));
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    clearInterval(drag.timer);
    drag.block.classList.remove('dragging'); document.body.classList.remove('is-dragging');
    drag = null; save(); redraw();
  }
  function onKey(e) {
    const grip = e.target.closest('.grip'); if (!grip) return;
    const block = grip.closest('.block');
    const sib = /Up|Left/.test(e.key) ? block.previousElementSibling : /Down|Right/.test(e.key) ? block.nextElementSibling : null;
    if (!sib || !sib.classList.contains('block')) return;
    e.preventDefault();
    move(() => /Up|Left/.test(e.key) ? sib.before(block) : sib.after(block));
    grip.focus(); save(); redraw();
  }
  function reset() {
    try { localStorage.removeItem(KEY); } catch {}
    const byId = Object.fromEntries(blocks().map(b => [b.dataset.id, b]));
    move(() => defaultOrder.forEach(id => byId[id] && board().appendChild(byId[id])));
    redraw();
  }
  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  document.addEventListener('keydown', onKey);
  $('reset-layout').addEventListener('click', reset);
  return { apply };
})();

// ---------- gauges ----------
const NS = 'http://www.w3.org/2000/svg';
function makeGauge(kind, label, unit) {
  const el = document.createElement('div');
  el.className = 'gauge ' + kind;
  const dial = kind === 'dial';
  el.innerHTML = `<svg viewBox="0 0 120 120">
      <circle class="track" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="${dial ? '75 100' : '100 0'}"/>
      <circle class="val" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="0 100"/>
      ${dial ? '<line class="needle" x1="60" y1="60" x2="86" y2="60"/><circle class="hub" cx="60" cy="60" r="4.5"/>' : ''}
    </svg>
    <div class="center"><div class="g-label">${label}</div><div class="g-num"><span>–</span><small>${unit}</small></div><div class="g-sub"></div></div>`;
  const val = el.querySelector('.val'), num = el.querySelector('.g-num span'),
        sub = el.querySelector('.g-sub'), needle = el.querySelector('.needle');
  return {
    el,
    set(v, max, text, opts = {}) {
      const na = v == null;
      el.classList.toggle('na', na);
      const f = na ? 0 : Math.max(0, Math.min(1, v / (max || 1)));
      val.setAttribute('stroke-dasharray', `${(dial ? 75 : 100) * f} 100`);
      val.style.stroke = css(opts.color || '--c1');
      if (needle) needle.style.transform = `rotate(${135 + 270 * f}deg)`;
      num.textContent = na ? '–' : text;
      sub.textContent = opts.sub || '';
    },
  };
}
const tempColor = (t, hi = 70, crit = 85) => t >= crit ? '--bad' : t >= hi ? '--warn' : '--c1';
const loadColor = v => v >= 90 ? '--bad' : v >= 70 ? '--warn' : '--c1';
let meters = null, meterKey = '';
function buildMeters(s) {
  // rebuild in place: new panels go where the old ones were
  const old = [...document.querySelectorAll('.block[data-meter]')];
  const anchor = old[0] || $('meters-anchor');
  const panel = (id, title, sub) => {
    const p = document.createElement('section');
    p.className = 'block panel w3';
    p.dataset.id = id; p.dataset.meter = '1';
    p.innerHTML = `<h3>${GRIP}${esc(title)}<span>${esc(sub)}</span></h3><div class="gauges"></div>`;
    anchor.before(p); return p.querySelector('.gauges');
  };
  const add = (box, g) => (box.appendChild(g.el), g);
  const m = { gpus: [] };
  const cbox = panel('m-cpu', 'CPU', INFO.cpu_model || '');
  m.cpuTemp = add(cbox, makeGauge('ring', 'TEMP', '°C'));
  m.cpuLoad = add(cbox, makeGauge('ring', 'LOAD', '%'));
  m.cpuClk = add(cbox, makeGauge('dial', 'CLOCK SPEED', 'MHz'));
  if (s.cpu.fan) m.cpuFan = add(cbox, makeGauge('dial', 'FAN SPEED', 'RPM'));
  s.gpus.forEach(g => {
    const b = panel('m-gpu-' + g.card, 'GPU', g.name);
    const gm = { temp: add(b, makeGauge('ring', 'TEMP', '°C')), load: add(b, makeGauge('ring', 'LOAD', '%')),
                 clk: add(b, makeGauge('dial', 'CLOCK SPEED', 'MHz')) };
    if (g.fan != null) gm.fan = add(b, makeGauge('dial', 'FAN SPEED', 'RPM'));
    m.gpus.push(gm);
  });
  m.ram = add(panel('m-ram', 'RAM', bytes(s.mem.total) + ' total'), makeGauge('ring', 'LOAD', '%'));
  old.forEach(b => b.remove());
  Layout.apply();
  return m;
}
function renderMeters(s) {
  const key = [s.gpus.length, s.gpus.map(g => g.fan != null).join(), !!s.cpu.fan, !!INFO.cpu_model].join('|');
  if (!meters || key !== meterKey) { meters = buildMeters(s); meterKey = key; }
  const m = meters, r0 = v => Math.round(v).toString();
  const t = s.cpu.temp;
  m.cpuTemp.set(t, 100, t != null ? r0(t) : '', { color: t != null ? tempColor(t, 75, 90) : '--c1' });
  m.cpuLoad.set(s.cpu.total, 100, r0(s.cpu.total), { color: loadColor(s.cpu.total) });
  m.cpuClk.set(s.cpu.freq, INFO.cpu_max_freq || 5000, s.cpu.freq != null ? r0(s.cpu.freq) : '');
  if (m.cpuFan) m.cpuFan.set(s.cpu.fan.rpm, 2500, r0(s.cpu.fan.rpm));
  s.gpus.forEach((g, i) => {
    const gm = m.gpus[i]; if (!gm) return;
    gm.temp.set(g.temp, 100, g.temp != null ? r0(g.temp) : '', { color: g.temp != null ? tempColor(g.temp) : '--c1' });
    gm.load.set(g.busy, 100, r0(g.busy), { color: loadColor(g.busy) });
    gm.clk.set(g.clock, g.clock_max || 3000, g.clock != null ? r0(g.clock) : '');
    if (gm.fan) gm.fan.set(g.fan, g.fan_max || 3500, r0(g.fan));
  });
  m.ram.set(s.mem.percent, 100, r0(s.mem.percent), { color: loadColor(s.mem.percent), sub: bytes(s.mem.used, 2) });

  const gb = n => {
    const v = n / 1e9;
    return v >= 1000 ? [(v / 1000).toFixed(2), 'TB'] : [v >= 100 ? v.toFixed(0) : v.toFixed(1), 'GB'];
  };
  $('storage').innerHTML = s.disks.filter(d => d.total > 2e9).map(d => {
    const free = d.total - d.used, [u, uu] = gb(d.used), [f, fu] = gb(free), [tt, tu] = gb(d.total);
    const dev = d.device.replace('/dev/', '');
    return `<div class="drive"><div class="dname"><span title="${esc(d.device)}">${esc(d.mount)} · ${esc(dev)}</span><span>${tt} ${tu}</span></div>
      <div class="blk used"><div class="bf" style="width:${d.percent}%;--fc:var(${d.percent >= 90 ? '--bad' : d.percent >= 75 ? '--warn' : '--c1'})"></div>
        <div class="bt"><b>${u}<small>${uu}</small></b><span>Used</span></div></div>
      <div class="blk free"><div class="bf" style="width:${100 - d.percent}%"></div>
        <div class="bt"><b>${f}<small>${fu}</small></b><span>Free</span></div></div></div>`;
  }).join('');
}

let INFO = {};
let last = null;
function render(s) {
  last = s;
  renderMeters(s);
  // KPIs
  $('k-cpu').textContent = pct(s.cpu.total);
  $('k-cpu').className = 'val ' + level(s.cpu.total, 70, 90);
  $('k-cpu-sub').textContent = 'load ' + s.cpu.load.map(v => v.toFixed(2)).join(' · ');
  $('k-mem').textContent = pct(s.mem.percent);
  $('k-mem').className = 'val ' + level(s.mem.percent, 75, 90);
  $('k-mem-sub').textContent = bytes(s.mem.used) + ' / ' + bytes(s.mem.total);
  const g0 = s.gpus.slice().sort((a, b) => (b.vram_total || 0) - (a.vram_total || 0))[0];
  if (g0) {
    $('k-gpu').textContent = g0.busy + '%';
    $('k-gpu-sub').textContent = 'VRAM ' + bytes(g0.vram_used) + ' / ' + bytes(g0.vram_total);
  } else { $('k-gpu').textContent = 'n/a'; }
  const rx = s.net.reduce((a, n) => a + n.rx, 0), tx = s.net.reduce((a, n) => a + n.tx, 0);
  $('k-net').innerHTML = `<span style="font-size:19px">${rate(rx)}</span>`;
  $('k-net-sub').textContent = '↑ ' + rate(tx);
  $('k-disk').innerHTML = `<span style="font-size:19px">${rate(s.disk_io.read)}</span>`;
  $('k-disk-sub').textContent = 'W ' + rate(s.disk_io.write);
  const hot = s.temps.slice().sort((a, b) => b.current - a.current)[0];
  if (hot) {
    $('k-temp').textContent = hot.current.toFixed(0) + '°C';
    $('k-temp').className = 'val ' + level(hot.current, 70, 85);
    $('k-temp-sub').textContent = hot.chip + ' · ' + hot.label;
  }
  $('uptime').textContent = 'up ' + dur(s.uptime);

  // history
  push(hist.cpu, s.cpu.total); push(hist.mem, s.mem.percent); push(hist.swap, s.swap.percent);
  push(hist.rx, rx); push(hist.tx, tx); push(hist.rd, s.disk_io.read); push(hist.wr, s.disk_io.write);
  s.gpus.forEach((g, i) => { hist.gpu[i] = hist.gpu[i] || []; push(hist.gpu[i], g.busy); });

  // Power
  const pw = s.power || {};
  const W = v => v == null ? '–' : v.toFixed(v < 10 ? 1 : 0) + ' W';
  push(hist.pwT, pw.total ?? 0); push(hist.pwC, pw.cpu ?? 0); push(hist.pwG, pw.gpu ?? 0);
  $('k-pw').textContent = W(pw.total);
  $('k-pw-sub').textContent = `CPU ${W(pw.cpu)} · GPU ${W(pw.gpu)}`;
  $('pw-meta').textContent = pw.total != null ? W(pw.total) + ' now' : 'no sensors';
  const st = a => a.length ? [a.reduce((x, y) => x + y, 0) / a.length, Math.max(...a)] : [null, null];
  const row = (name, col, now, arr) => { const [avg, pk] = st(arr);
    return `<tr><td><span class="swatch" style="background:var(${col})"></span>${name}</td><td class="num">${W(now)}</td><td class="num">${W(avg)}</td><td class="num">${W(pk)}</td></tr>`; };
  $('pw-table').innerHTML = '<tr><th>Source</th><th class="num">Now</th><th class="num">Avg 2 min</th><th class="num">Peak 2 min</th></tr>' +
    row('CPU', '--c1', pw.cpu, hist.pwC) +
    (pw.gpus || []).map(g => row(esc(g.name.split('/')[0].trim()), '--c4', g.watts, hist.pwG)).join('') +
    `<tr style="font-weight:600">${row('Total', '--c3', pw.total, hist.pwT).slice(4)}`;
  $('pw-note').textContent = `CPU = ${pw.cpu_source || 'n/a'}${pw.cpu_source && pw.cpu_source.startsWith('APU') ? ' (includes integrated GPU)' : ''} · GPU = graphics card board power. Total covers CPU + GPU only, not drives, fans or PSU losses.`;

  // CPU
  $('cpu-meta').textContent = (s.cpu.freq ? (s.cpu.freq / 1000).toFixed(2) + ' GHz · ' : '') + s.cpu.per_core.length + ' threads';
  const cores = $('cores');
  if (cores.children.length !== s.cpu.per_core.length)
    cores.innerHTML = s.cpu.per_core.map((_, i) => `<div class="core">${i}<b></b><div class="fill"></div></div>`).join('');
  s.cpu.per_core.forEach((v, i) => {
    const c = cores.children[i];
    c.querySelector('b').textContent = Math.round(v) + '%';
    const f = c.querySelector('.fill'); f.style.width = v + '%';
    f.style.background = css(v >= 90 ? '--bad' : v >= 70 ? '--warn' : '--c1');
  });

  // Memory
  $('mem-meta').textContent = bytes(s.mem.total) + ' total';
  $('mem-txt').textContent = `${bytes(s.mem.used)} · ${bytes(s.mem.cached)} / ${bytes(s.mem.total)}`;
  $('mem-used').style.width = (s.mem.used / s.mem.total * 100) + '%';
  $('mem-cache').style.width = Math.min(s.mem.cached / s.mem.total * 100, 100 - s.mem.used / s.mem.total * 100) + '%';
  $('swap-txt').textContent = s.swap.total ? `${bytes(s.swap.used)} / ${bytes(s.swap.total)}` : 'none';
  $('swap-bar').style.width = s.swap.percent + '%';

  // Network
  $('net-meta').textContent = s.net.length + ' interface' + (s.net.length === 1 ? '' : 's');
  $('nics').innerHTML = '<tr><th>Interface</th><th class="num">↓ now</th><th class="num">↑ now</th><th class="num">↓ total</th><th class="num">↑ total</th></tr>' +
    s.net.map(n => `<tr><td>${esc(n.name)}</td><td class="num">${rate(n.rx)}</td><td class="num">${rate(n.tx)}</td><td class="num">${bytes(n.rx_total)}</td><td class="num">${bytes(n.tx_total)}</td></tr>`).join('');

  // Disks
  $('disk-meta').textContent = s.disks.length + ' filesystem' + (s.disks.length === 1 ? '' : 's');
  $('disks').innerHTML = s.disks.map(d => `<div class="bar-row"><div class="top"><span title="${esc(d.device)}">${esc(d.mount)} <span style="color:var(--muted)">${esc(d.device)}</span></span><span>${bytes(d.used)} / ${bytes(d.total)} · ${d.percent.toFixed(0)}%</span></div>
    <div class="bar"><div style="width:${d.percent}%;background:var(${d.percent >= 90 ? '--bad' : d.percent >= 75 ? '--warn' : '--c2'})"></div></div></div>`).join('');

  // GPUs
  const gcol = ['--c4', '--c1', '--c3', '--c2'];
  $('gpu-meta').textContent = s.gpus.length ? s.gpus.length + ' device' + (s.gpus.length > 1 ? 's' : '') : 'none detected';
  $('gpu-legend').innerHTML = s.gpus.map((g, i) => `<span><i style="background:var(${gcol[i % 4]})"></i>${esc(g.card)} busy</span>`).join('');
  $('gpus').innerHTML = s.gpus.map(g => {
    const vp = g.vram_total ? g.vram_used / g.vram_total * 100 : 0;
    return `<div class="gpu"><div style="font-weight:500;margin-bottom:4px">${esc(g.name)} <span style="color:var(--muted);font-weight:400">${esc(g.card)}</span></div>
      <div class="stats"><span>Busy <b>${g.busy}%</b></span>${g.temp != null ? `<span>Temp <b>${g.temp.toFixed(0)}°C</b></span>` : ''}${g.power != null ? `<span>Power <b>${g.power.toFixed(1)} W</b></span>` : ''}</div>
      <div class="bar-row"><div class="top"><span>VRAM</span><span>${bytes(g.vram_used)} / ${bytes(g.vram_total)}</span></div><div class="bar"><div style="width:${vp}%;background:var(--c4)"></div></div></div></div>`;
  }).join('');

  // Temps
  $('temps').innerHTML = s.temps.map(t => `<div class="temp"><div class="t ${level(t.current, t.high || 70, t.critical || 85)}">${t.current.toFixed(1)}°</div><div class="l" title="${esc(t.chip)} ${esc(t.label)}">${esc(t.chip)} · ${esc(t.label)}</div></div>`).join('');

  // Procs
  $('procs').innerHTML = '<tr><th class="num">PID</th><th>Name</th><th>User</th><th class="num" title="100% = one full core">CPU (core %)</th><th class="num">Memory</th></tr>' +
    s.procs.map(p => `<tr><td class="num">${p.pid}</td><td class="name">${esc(p.name)}</td><td>${esc(p.user)}</td><td class="num">${p.cpu.toFixed(1)}%</td><td class="num">${bytes(p.rss)}</td></tr>`).join('');

  drawAll();
}

function drawAll() {
  if (!last) return;
  const p = v => v.toFixed(0) + '%';
  drawChart($('ch-cpu'), [{ data: hist.cpu, color: '--c1', fill: true }], { max: 100, fmt: p });
  drawChart($('ch-mem'), [{ data: hist.mem, color: '--c2', fill: true }, { data: hist.swap, color: '--c3' }], { max: 100, fmt: p });
  drawChart($('ch-net'), [{ data: hist.rx, color: '--c1', fill: true }, { data: hist.tx, color: '--c4' }], { fmt: v => bytes(v, 0) });
  drawChart($('ch-disk'), [{ data: hist.rd, color: '--c2', fill: true }, { data: hist.wr, color: '--c3' }], { fmt: v => bytes(v, 0) });
  drawChart($('ch-power'), [{ data: hist.pwT, color: '--c3', fill: true }, { data: hist.pwC, color: '--c1' }, { data: hist.pwG, color: '--c4' }],
            { fmt: v => v.toFixed(0) + ' W' });
  const gcol = ['--c4', '--c1', '--c3', '--c2'];
  drawChart($('ch-gpu'), hist.gpu.map((d, i) => ({ data: d, color: gcol[i % 4], fill: i === 0 })), { max: 100, fmt: p });
}
window.addEventListener('resize', drawAll);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawAll);

fetch('api/info').then(r => r.json()).then(i => {
  INFO = i; meterKey = '';
  $('host').textContent = i.hostname;
  document.title = i.hostname + ' · Server Monitor';
  $('os').textContent = i.os + ' · ' + i.kernel;
  $('cpumodel').textContent = i.cpu_model + ` (${i.cores}C/${i.threads}T)`;
});

function connect() {
  const es = new EventSource('api/stream');
  es.onopen = () => { $('dot').classList.add('live'); $('conn').textContent = 'live'; };
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { $('dot').classList.remove('live'); $('conn').textContent = 'reconnecting…'; };
}
fetch('api/snapshot').then(r => r.json()).then(s => { if (s && !last) render(s); }).catch(() => {});
connect();
</script>
</body>
